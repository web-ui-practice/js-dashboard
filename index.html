<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>JS Dashboard</title>
  </head>
  <body>
    <aside>
      <a class="logo-container" href="#">
        <img class="logo" src="images/Brand-mark.svg" alt="" />
        <span class="logo-title">Workspace</span>
      </a>

      <nav class="menu-container">
        <ul class="flex-menu">
          <li>
            <a class="items-menu items-menu--disabled" aria-current="page" href="#">
              <img class="logo-menu" src="images/dashboard.svg" alt="" />
              <span class="menu-text">Dashboard</span>
            </a>
          </li>
          <li>
            <a class="items-menu items-menu--disabled" href="#">
              <img class="logo-menu" src="images/users.svg" alt="" />
              <span class="menu-text">Users</span>
            </a>
          </li>
          <li>
            <a class="items-menu items-menu--disabled" href="#">
              <img class="logo-menu" src="images/activity.svg" alt="" />
              <span class="menu-text">Activity</span>
            </a>
          </li>
          <li>
            <a class="items-menu items-menu--disabled" href="#">
              <img class="logo-menu" src="images/settings.svg" alt="" />
              <span class="menu-text">Settings</span>
            </a>
          </li>
        </ul>
      </nav>

      <footer class="footer-container">
        <p class="footer-text-first">Acme Studio</p>
        <p class="footer-text-second">Team workspace</p>
      </footer>
    </aside>
    <div class="container-header-main">
      <header class="header">
        <h1 class="header-title">Dashboard</h1>
        <div class="header-block-about-user">
          <span class="header-user-icon">MC</span>
          <div class="header-user-info">
            <span class="header-user-name">Maya Chen</span>
            <span class="header-user-status">Workspace admin</span>
          </div>
        </div>
      </header>

      <main></main>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
